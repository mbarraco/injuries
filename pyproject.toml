[project]
name = "injuries"
version = "0.1.0"
description = "UEFA injury database: throttle-aware Sportmonks ingestion + FastAPI POC"
requires-python = ">=3.14"
dependencies = [
    # ingest pipeline
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    # web app
    "fastapi>=0.139,<1",
    "uvicorn>=0.51,<1",
    "jinja2>=3.1,<4",
]

[dependency-groups]
# Installed by default under `uv run` / `uv sync`.
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",  # required by fastapi.testclient in tests/test_api.py
]

[tool.uv]
# Not a distributable package — no build backend needed. `python -m ingest.*`
# and `python -m app.*` resolve via the working directory, so uv just manages
# the environment and its dependencies.
package = false

[tool.pytest.ini_options]
# `uv run pytest` invokes the console script, which (unlike `python -m pytest`)
# does not put the project root on sys.path — so `from app import ...` /
# `from ingest import ...` would fail to import. Add the root explicitly.
pythonpath = ["."]
testpaths = ["tests"]
