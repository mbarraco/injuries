<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Injury Data{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="sidebar">
    <div class="brand"><span class="brand-mark">◆</span><div><strong>Injury Data</strong><small>Sportmonks · UEFA</small></div></div>
    <a href="/" class="{{ 'active' if active == 'coverage' else '' }}">Coverage &amp; Quality</a>
    <a href="/analytics" class="{{ 'active' if active == 'analytics' else '' }}">Analytics</a>
    <a href="/absences" class="{{ 'active' if active == 'absences' else '' }}">Absences</a>
    <a href="/seasons" class="{{ 'active' if active == 'seasons' else '' }}">Seasons</a>
    <div class="sidebar-foot"><a href="/docs">API docs →</a></div>
  </nav>
  <main><header class="page-head"><h1>{% block heading %}{% endblock %}</h1><p class="subtitle">{% block subtitle %}{% endblock %}</p></header>{% block content %}{% endblock %}</main>
  <script src="/static/chart.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
